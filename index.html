: 0;\">\n    <div style=\"display: flex; gap: 6px; flex-wrap: nowrap;\">\n      <a href=\"#excellence\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">בית ספר מצטיין<\u002Fa>\n      <a href=\"#learning\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4\">תפיסת הלמידה<\u002Fa>\n      <a href=\"#values\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">ארבעת הערכים<\u002Fa>\n      <a href=\"#expectations\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">תיאום ציפיות<\u002Fa>\n      <a href=\"#phones\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">נוהל פלאפונים<\u002Fa>\n      <a href=\"#payments\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">תשלומים וספרים<\u002Fa>\n      <a href=\"#schedule\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">לוח היום הראשון<\u002Fa>\n      <a href=\"#map\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">מפת הכיתות<\u002Fa>\n      <a href=\"#equipment\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">רשימת ציוד<\u002Fa>\n      <a href=\"#staff\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">הצוות החינוכי<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <header style=\"max-width: 880px; margin: 0 auto; padding: 64px 28px 40px; text-align: center;\">\n    <div style=\"position: relative; width: 200px; height: 200px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: center;\">\n      <div style=\"position: absolute; width: 0; height: 0; border-left: 100px solid transparent; border-right: 100px solid transparent; border-bottom: 170px solid #a4b83c; top: 6px; opacity: 0; animation: triangleIn 1.1s ease-out 0.15s forwards;\"><\u002Fdiv>\n      <img src=\"dfa845ee-35ab-48b5-a579-25db5d2a7a34\" alt=\"אמית חצור הגלילית\" style=\"position: relative; height: 130px; width: auto; opacity: 0; animation: logoPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;\">\n    <\u002Fdiv>\n    <div style=\"font-family: 'Frank Ruhl Libre', serif; font-style: italic; font-size: 20px; color: #6b7c50; margin-bottom: 10px; opacity: 0; animation: fadeUp 0.7s ease-out 0.9s forwards;\">\"חובת האדם בעולמו, כל עוד הנשמה באפו, להשתדל להיות הולך וגדל\" (החזו\"א)<\u002Fdiv>\n    <h1 style=\"font-size: 38px; font-weight: 800; color: #16283f; margin: 0 0 14px; line-height: 1.25; opacity: 0; animation: fadeUp 0.7s ease-out 1.05s forwards;\">לקראת פתיחת שנת הלימודים תשפ\"ז<\u002Fh1>\n    <p style=\"font-size: 19px; color: #5b6b7a; margin: 0; opacity: 0; animation: fadeUp 0.7s ease-out 1.2s forwards;\">הורים יקרים ואהובים, ה' עימכם<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"max-width: 720px; margin: 0 auto; padding: 0 28px 56px;\">\n    <p style=\"font-size: 17px; line-height: 1.9; color: #3c4a58; margin: 0; text-wrap: pretty; text-align: justify\">\n      בפרשת השבוע שקראנו לפני שבועיים, קראנו על סימן הטהרה של הדג — כל דג שיש לו קשקשת וסנפיר כשר למאכל. מלמדים אותנו חז\"ל שבדרך הטבע כל דג שיש לו קשקשת יש לו גם סנפיר. שואלים חז\"ל, אם כך מדוע לא לכתוב שכל דג שיש לו קשקשת כשר? (הרי אם יש קשקשת יש סנפיר).\n      <br><br>\n      הקשקשת מבטאת את הדבר הקבוע — היציב, ואילו הסנפיר מבטא את התנועה והשינוי. כשיש את הדברים הקבועים בתורה, יש אפשרות להיות בתנועה גם לדברים המשתנים. היכולת ליצור שינוי היא על בסיס עוגנים ודברים קבועים שלא ניתנים לשינוי.\n      <br><br>\n      אנו משתדלים בבית החינוך להתחדש בכל שנה על בסיס הערכים הקבועים שנותנים לנו עוגן ויציבות — להמשיך להכות שורשים בארבעת ערכי בית החינוך, ולצד זה להיות ערים לצרכים שמתעוררים, לאפשר למידה מותאמת ולעדכן את התוכניות הערכיות-חברתיות כדי להיות הכי טובים שאפשר.\n      <br><br>\n      בע\"ה במהלך השנה הקרובה נשתדל לעלות קומה נוספת בארבעת ערכי בית החינוך.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"excellence\" style=\"scroll-margin-top: 90px; background: #f4f2e8; border-top: 1px solid #e6e2d8; border-bottom: 1px solid #e6e2d8; padding: 38px 28px;\">\n    <div style=\"max-width: 780px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 20px;\">\n        <div style=\"width: 46px; height: 46px; border-radius: 50%; background: #a4b83c; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #16283f; font-weight: 800; font-size: 19px;\">1<\u002Fdiv>\n        <div>\n          <div style=\"color: #6b7c33; font-weight: 700; font-size: 13px; letter-spacing: 0.06em;\">משרד החינוך — תשפ\"ו<\u002Fdiv>\n          <h2 style=\"font-size: 27px; font-weight: 800; color: #16283f; margin: 2px 0 0;\">ברשימת בתי הספר המצטיינים<\u002Fh2>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ closedExcellence }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size: 17px; line-height: 1.9; color: #3c4a58; margin: 0 0 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\">ב\"ה, גם השנה זכינו להיכנס לרשימת בתי ספר המצטיינים של משרד החינוך. בשנה שחלפה, התשפ\"ו, בית החינוך אמית חצור הגלילית דורג ברמה 1, הגבוהה ביותר.<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleExcellence }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n        <sc-if value=\"{{ openExcellence }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n        <sc-if value=\"{{ closedExcellence }}\" hint-placeholder-val=\"{{ true }}\">להמשך קריאה<\u002Fsc-if>\n      <\u002Fbutton>\n      <sc-if value=\"{{ openExcellence }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-size: 17px; line-height: 1.9; color: #3c4a58; margin: 18px 0 0; text-align: justify; text-wrap: pretty;\">\n        ב\"ה, גם השנה זכינו להיכנס לרשימת בתי ספר המצטיינים של משרד החינוך.\n        בשנה שחלפה, התשפ\"ו, בית החינוך אמית חצור הגלילית דורג ברמה 1, הגבוהה ביותר, לאור הישגים גבוהים בתחום הערכי והפדגוגי בדגש על זכאות לבגרות איכותית.\n      <\u002Fp>\n      <p style=\"font-size: 17px; line-height: 1.9; color: #3c4a58; margin: 18px 0 0; text-align: justify; text-wrap: pretty;\">\n        בבית החינוך אנו משתדלים להוביל תהליך משמעותי החל מכיתה ז עד סוף יב. מדובר במסע ארוך ולא קל, השליחות החינוכית היא תהליך של אמון, סבלנות וראיית הטוב. אנו בוחנים את עצמנו בסוף כיתה יב, כאשר הנערים והנערות שלנו בוחרים במסלולי ההמשך, ישיבות, מכינות, מדרשות, שירות לאומי ושירות צבאי. בכל שנה מרגש לראות את בנינו ובנותינו משמשים בתפקידים משמעותיים ועושים דברים גדולים למען העם והארץ.\n      <\u002Fp>\n      <p style=\"font-size: 17px; line-height: 1.9; color: #16283f; font-weight: 600; margin: 18px 0 0; padding-right: 16px; border-right: 3px solid #a4b83c;\">\n        תודה מיוחדת לצוות החינוכי הכולל את צוות המנהלה וצוות ההוראה אשר בזכותם בית החינוך זוכה שוב להיכלל ברשימת בתי הספר המצטיינים ביותר בארץ.\n      <\u002Fp>\n      <div style=\"margin: 22px 0 0;\">\n        <div style=\"font-size: 14px; font-weight: 700; color: #6b7c33; margin-bottom: 8px;\">מתוך רשימת בתי הספר הזוכים<\u002Fdiv>\n        <img src=\"5ebee6d1-cc9a-4c8b-b4ea-fb7dc2e5b824\" alt=\"קרית החינוך אמי\" ת=\"\" ברשימת=\"\" בתי=\"\" הספר=\"\" המצטיינים\"=\"\" style=\"display: block; width: 100%; height: auto; border: 1px solid #e6e2d8; border-radius: 10px; background: #fff;\">\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"values\" style=\"scroll-margin-top: 90px; background: #16283f; padding: 44px 28px;\">\n    <div style=\"max-width: 880px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 26px;\">\n        <div style=\"color: #a4b83c; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; margin-bottom: 8px;\">מה מוביל אותנו השנה<\u002Fdiv>\n        <h2 style=\"color: #fff; font-size: 30px; font-weight: 800; margin: 0;\">ארבעת ערכי בית החינוך<\u002Fh2>\n      <\u002Fdiv><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px;\">\n        <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"4\">\n          <div style=\"background: #1f3a5f; border-radius: 14px; padding: 24px; cursor: pointer;\" sc-camel-on-click=\"{{ v.toggle }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #a4b83c; flex-shrink: 0; position: relative;\">\n                  <sc-if value=\"{{ v.isTorah }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 13px; height: 17px; background: #16283f; border-radius: 2px; left: 9px; top: 13px; transform: rotate(-16deg);\"><\u002Fdiv>\n                    <div style=\"position: absolute; width: 13px; height: 17px; background: #16283f; border-radius: 2px; right: 9px; top: 13px; transform: rotate(16deg);\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isExcellence }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 18px; height: 18px; background: #16283f; top: 13px; left: 13px; transform: rotate(45deg); border-radius: 3px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isSocial }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #16283f; opacity: 0.85; left: 10px; top: 14px;\"><\u002Fdiv>\n                    <div style=\"position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #16283f; opacity: 0.85; right: 10px; top: 14px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isFamily }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 0; height: 0; left: 12px; top: 11px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 9px solid #16283f;\"><\u002Fdiv>\n                    <div style=\"position: absolute; width: 14px; height: 11px; background: #16283f; left: 15px; top: 20px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <h3 style=\"color: #fff; font-size: 19px; font-weight: 700; margin: 0;\">{{ v.title }}<\u002Fh3>\n              <\u002Fdiv>\n              <div style=\"width: 26px; height: 26px; border-radius: 50%; background: #a4b83c; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #16283f; font-weight: 800; font-size: 16px;\">\n                <sc-if value=\"{{ v.open }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n                <sc-if value=\"{{ v.closed }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ v.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"color: #cfd8e2; font-size: 15px; line-height: 1.85; margin: 16px 0 0;\">{{ v.text }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"learning\" style=\"scroll-margin-top: 90px; max-width: 880px; margin: 0 auto; padding: 40px 28px;\">\n    <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">תפיסת הלמידה של רשת אמית<\u002Fh2>\n    <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 24px;\"><\u002Fdiv>\n    <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 0; text-align: justify\">\n      רשת אמית מובילה תפיסת למידה חדשנית, שבה התלמיד הוא שותף פעיל בתהליך – חוקר, מגלה, יוצר ולומד באופן עצמאי ושיתופי. התוכנית מאפשרת מגוון דרכי למידה ומפתחת עצמאות, יצירתיות, חשיבה ביקורתית ויכולת להתמודד עם אתגרי העתיד.\n    <\u002Fp><div style=\"display: flex; align-items: center; gap: 16px; margin-top: 20px; flex-wrap: wrap;\">\n      <button sc-camel-on-click=\"{{ toggleLearning }}\" style=\"background: none; border: none; color: #6b7c33; font-weight: 700; font-size: 15px; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 6px;\">\n        <sc-if value=\"{{ learningOpen }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n        <sc-if value=\"{{ learningClosed }}\" hint-placeholder-val=\"{{ true }}\">קרא עוד<\u002Fsc-if>\n      <\u002Fbutton>\n      <a href=\"https://youtu.be/OOSgWGp8zjA?si=lDTfoUnlS3Qq1y_5\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration: none; display: inline-flex; align-items: center; gap: 8px; background: #16283f; color: #fff; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px;\">\n        <span style=\"width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 9px solid #fff;\"><\u002Fspan>\n        לצפייה בסרטון על התפיסה הפדגוגית\n      <\u002Fa>\n    <\u002Fdiv>\n    <sc-if value=\"{{ learningOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 20px 0 0; text-align: justify\">\n        זוהי תוכנית צומחת, המיושמת בבית הספר בהדרגה וכיום מתקיימת בשכבות ז׳–ח׳. הכרומבוק האישי הוא כלי מרכזי בתפיסה זו, המאפשר למידה אחרת, עצמאית, חוקרת ושיתופית.\n      <\u002Fp>\n      <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 16px 0 0; text-align: justify\">\n        עלות הכרומבוק היא 1,200 ₪ במחיר מסובסד, בתשלום בשלוש פעימות לאורך שלוש שנים. חוזר מפורט והסברים יימסרו להורים בתחילת השנה.\n      <\u002Fp>\n    <\u002Fsc-if>\n    \n  <\u002Fsection>\n\n  <section id=\"expectations\" style=\"scroll-margin-top: 90px; max-width: 880px; margin: 0 auto; padding: 40px 28px;\">\n    <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">תיאום ציפיות<\u002Fh2>\n    <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 28px;\"><\u002Fdiv>\n\n    <sc-if value=\"{{ closedExpectations }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font-size: 16px; line-height: 1.85; color: #3c4a58; margin: 0 0 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\">אנו מבקשים להקפיד על הגעה בזמן לבית החינוך, ובוודאי לא להחסיר ימים שלמים. כמו כן מפורטים כאן כללי ההופעה החיצונית לבנים ולבנות.<\u002Fp>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ toggleExpectations }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n      <sc-if value=\"{{ openExpectations }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n      <sc-if value=\"{{ closedExpectations }}\" hint-placeholder-val=\"{{ true }}\">להמשך קריאה<\u002Fsc-if>\n    <\u002Fbutton>\n    <sc-if value=\"{{ openExpectations }}\" hint-placeholder-val=\"{{ false }}\">\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 24px 0 8px;\">נוכחות והגעה בזמן לתפילה<\u002Fh3>\n    <p style=\"font-size: 16px; line-height: 1.85; color: #3c4a58; margin: 0 0 32px; text-align: justify\">\n      אנו מבקשים להקפיד על הגעה בזמן לבית החינוך, ובוודאי לא להחסיר ימים שלמים. אנו מבקשים מכם ההורים לשלב איתנו זרועות ולוודא שהבן/הבת מתמידים בהגעה לבית החינוך. לא ניתן לקיים תהליך משמעותי עם תלמיד/ה שנעדרים.\n    <\u002Fp>\n\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 0 0 16px;\">כללי הופעה חיצונית<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px;\">\n      <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 14px; padding: 22px;\">\n        <div style=\"display: inline-block; background: #eef1e0; color: #6b7c33; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;\">בנים<\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0 20px 0 0; font-size: 15px; line-height: 1.8; color: #3c4a58; text-align: justify\">\n          <li style=\"margin-bottom: 12px;\"><strong>חולצת תלבושת<\u002Fstrong> — עם לוגו \"להיות הולך וגדל\" (גאוות יחידה ושייכות), כיפה — \"כומתה יהודית\".<\u002Fli>\n          <li><strong>מכנס קצר<\u002Fstrong> — יש להקפיד על מכנס שמגיע עד הברכיים, ונעליים סגורות או סנדלים (אין להגיע עם כפכפים). תלמיד שיגיע עם מכנס קצר מעל הברכיים יחזור הביתה להחליף.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 14px; padding: 22px;\">\n        <div style=\"display: inline-block; background: #eef1e0; color: #6b7c33; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;\">בנות<\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0 20px 0 0; font-size: 15px; line-height: 1.8; color: #3c4a58; text-align: justify\">\n          <li><strong>חולצת תלבושת<\u002Fstrong> — חולצה עם סמל ביה\"ס<div>לא תתאפשר הגעה עם חולצה חשופה או בעלת שרוולים קצרים מידי (אורך שרוול- אגרוף מעל המרפק)<\u002Fdiv><\u002Fli><li style=\"margin-bottom: 12px; font-size: 15px\"><strong>חצאיות<\u002Fstrong> — מתחת לברך. מי שתגיע בבוקר עם חצאית קצרה תחזור באותו יום הביתה כדי להחליף.<\u002Fli>\n          \n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"phones\" style=\"scroll-margin-top: 90px; background: #f2f0e4; padding: 40px 28px;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 8px;\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1f3a5f; flex-shrink: 0; position: relative;\">\n          <div style=\"position: absolute; width: 16px; height: 26px; border: 2px solid #a4b83c; border-radius: 4px; left: 12px; top: 9px;\"><\u002Fdiv>\n          <div style=\"position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #a4b83c; left: 18px; top: 27px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0;\">נוהל פלאפונים<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 24px;\"><\u002Fdiv>\n      <sc-if value=\"{{ closedPhones }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 0 0 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\">בתחילת כל יום מחנכי ומחנכות הכיתות יאספו את הניידים ויחזירו אותם בסוף היום. הפלאפון מסיח את הדעת ומוריד את רמת הקשב.<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ togglePhones }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n        <sc-if value=\"{{ openPhones }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n        <sc-if value=\"{{ closedPhones }}\" hint-placeholder-val=\"{{ true }}\">להמשך קריאה<\u002Fsc-if>\n      <\u002Fbutton>\n      <sc-if value=\"{{ openPhones }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 18px 0 0; text-align: justify\">\n        בתחילת כל יום מחנכי ומחנכות הכיתות יאספו את הניידים ויחזירו אותם בסוף היום. אנו עדים ליותר ויותר בתי ספר בעולם ובארץ שמבינים שלא ניתן לקיים שגרת יום לימודים ושיח חינוכי מקדם כשהתלמיד/ה אוחז ביד את הנייד. הפלאפון מסיח את הדעת ומוריד את רמת הקשב. בנוסף, הוא מעכב התפתחות בינאישית ויכולת ליצור אינטראקציה בריאה עם הסביבה.\n        <br><br>\n        במהלך השנה מחנכי הכיתות יובילו שיח ופעילות סביב נושא חשוב זה. אנו מבקשים מכם ההורים להיות שותפים מלאים במשימה המאתגרת בפניה אנו עומדים, מתוך אהבה לתלמידינו היקרים והאהובים ולמענם.\n        <br><br>\n        בהזדמנות זו אנו רוצים להמליץ לכלל ההורים לרכוש תוכנת הגנה לפלאפונים של הילדים. הילדים נחשפים במדיה לאלימות קשה, פורנוגרפיה ועוד, והמחקרים מדברים על חשיפה לפורנוגרפיה קשה כבר בשלבי היסודי. עלינו האחריות לשמור על הנשמות הטהורות שלנו. מי שמעוניין — שיצור קשר עם מחנך/מחנכת הכיתה, ואנחנו נסייע בשמחה.\n      <\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"payments\" style=\"scroll-margin-top: 90px; max-width: 880px; margin: 0 auto; padding: 40px 28px;\">\n    <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">השתתפות הורים וחלוקת ספרים<\u002Fh2>\n    <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 24px;\"><\u002Fdiv>\n    <p style=\"font-size: 16px; line-height: 1.85; color: #3c4a58; margin: 0 0 36px;\">\n      גם השנה תתקיים \"השאלת ספרים\" בכל השכבות. רק תלמידים אשר ישלמו את מלוא סכום התשלום השנתי לבית הספר יוכלו להשתתף בפרויקט ולקבל את כל הספרים בימי החלוקה המסודרים.\n    <\u002Fp>\n\n    <button sc-camel-on-click=\"{{ togglePayments }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n      <sc-if value=\"{{ openPayments }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n      <sc-if value=\"{{ closedPayments }}\" hint-placeholder-val=\"{{ true }}\">לחצו לצפייה בטבלת התשלומים<\u002Fsc-if>\n    <\u002Fbutton>\n    <sc-if value=\"{{ openPayments }}\" hint-placeholder-val=\"{{ false }}\">\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 24px 0 14px;\">בחרו שכבה כדי לראות את סכום התשלום<\u002Fh3>\n    <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ g.select }}\" style=\"border: 2px solid #1f3a5f; background: #fff; color: #1f3a5f; font-weight: 700; font-size: 15px; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-family: 'Heebo', sans-serif;\" style-hover=\"background: #eef1e0;\">שכבה {{ g.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background: #16283f; border-radius: 14px; padding: 22px 26px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 10px;\">\n      <span style=\"color: #cfd8e2; font-size: 16px; font-weight: 600;\">סה\"כ לשכבה {{ selectedGradeLabel }}<\u002Fspan>\n      <span style=\"color: #a4b83c; font-size: 30px; font-weight: 800;\">{{ selectedTotal }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x: auto; border: 1px solid #e6e2d8; border-radius: 14px;\">\n      <div style=\"min-width: 640px; font-size: 14px;\">\n        <div style=\"display: grid; grid-template-columns: 2fr repeat(6, 1fr); background: #f2f0e4;\">\n          <div style=\"text-align: right; padding: 12px 16px; font-weight: 700; color: #16283f;\">סעיף<\u002Fdiv>\n          <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <div style=\"text-align: center; padding: 12px 10px; font-weight: 700; color: #16283f;\">{{ g.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ feeRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n          <div style=\"display: grid; grid-template-columns: 2fr repeat(6, 1fr); border-top: 1px solid #efece0;\">\n            <div style=\"padding: 10px 16px; color: #3c4a58;\">{{ row.label }}<\u002Fdiv>\n            <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"6\">\n              <div style=\"text-align: center; padding: 10px; color: #3c4a58;\">{{ cell.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display: grid; grid-template-columns: 2fr repeat(6, 1fr); border-top: 2px solid #1f3a5f; background: #f2f0e4;\">\n          <div style=\"padding: 12px 16px; font-weight: 800; color: #16283f;\">סה\"כ<\u002Fdiv>\n          <sc-for list=\"{{ totals }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"text-align: center; padding: 12px; font-weight: 800; color: #16283f;\">{{ t.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 36px 0 14px;\">ימי חלוקת ספרים<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;\">\n      <sc-for list=\"{{ bookDays }}\" as=\"d\" hint-placeholder-count=\"5\">\n        <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 12px; padding: 16px; text-align: center;\">\n          <div style=\"font-weight: 700; color: #16283f; font-size: 15px; margin-bottom: 4px;\">{{ d.day }}<\u002Fdiv>\n          <div style=\"color: #8a7f56; font-size: 13px; margin-bottom: 8px;\">{{ d.hebrew }} · {{ d.date }}<\u002Fdiv>\n          <div style=\"display: inline-block; background: #eef1e0; color: #6b7c33; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px;\">{{ d.hours }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"schedule\" style=\"scroll-margin-top: 90px; background: #f2f0e4; padding: 40px 28px;\">\n    <div style=\"max-width: 880px; margin: 0 auto;\">\n      <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">לו\"ז יום ראשון ללימודים<\u002Fh2>\n      <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 28px;\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleSchedule }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n        <sc-if value=\"{{ openSchedule }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n        <sc-if value=\"{{ closedSchedule }}\" hint-placeholder-val=\"{{ true }}\">לחצו לצפייה בלו\"ז<\u002Fsc-if>\n      <\u002Fbutton>\n      <sc-if value=\"{{ openSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 20px; margin-top: 18px;\">\n        <div style=\"background: #fff; border-radius: 14px; padding: 22px;\">\n          <div style=\"display: inline-block; background: #16283f; color: #fff; font-weight: 700; font-size: 13px; padding: 4px 14px; border-radius: 999px; margin-bottom: 16px;\">נתיב בנים<\u002Fdiv>\n          <sc-for list=\"{{ boysSchedule }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #efece0;\">\n              <div dir=\"ltr\" style=\"width: 110px; flex-shrink: 0; font-weight: 700; color: #1f3a5f; font-size: 14px; text-align: left;\">{{ s.time }}<\u002Fdiv>\n              <div style=\"color: #3c4a58; font-size: 14px;\">{{ s.activity }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border-radius: 14px; padding: 22px;\">\n          <div style=\"display: inline-block; background: #a4b83c; color: #16283f; font-weight: 700; font-size: 13px; padding: 4px 14px; border-radius: 999px; margin-bottom: 16px;\">נתיב בנות<\u002Fdiv>\n          <sc-for list=\"{{ girlsSchedule }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #efece0;\">\n              <div dir=\"ltr\" style=\"width: 110px; flex-shrink: 0; font-weight: 700; color: #1f3a5f; font-size: 14px; text-align: left;\">{{ s.time }}<\u002Fdiv>\n              <div style=\"color: #3c4a58; font-size: 14px;\">{{ s.activity }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"map\" style=\"scroll-margin-top: 90px; background: #f2f0e4; padding: 40px 28px;\">\n    <div style=\"max-width: 980px; margin: 0 auto;\">\n      <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">מפת הכיתות<\u002Fh2>\n      <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 18px;\"><\u002Fdiv>\n      <sc-if value=\"{{ closedMap }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 0 0 16px;\">שני מבנים — תבור וארבל — שני מפלסים בכל מבנה. כאן מופיע שיבוץ הכיתות לחדרים.<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleMap }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n        <sc-if value=\"{{ openMap }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n        <sc-if value=\"{{ closedMap }}\" hint-placeholder-val=\"{{ true }}\">לחצו לצפייה במפה<\u002Fsc-if>\n      <\u002Fbutton>\n      <sc-if value=\"{{ openMap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: grid; gap: 22px; margin-top: 20px;\">\n          <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 16px; padding: 14px;\">\n            <img src=\"50ff925a-8b65-4928-b134-97cbbd7133fb\" alt=\"תרשים שיבוץ הכיתות — מבנה תבור ומבנה ארבל\" style=\"display: block; width: 100%; height: auto; border-radius: 8px;\">\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 16px; padding: 14px;\">\n            <img src=\"be555e70-d563-4e30-a10d-a31c9b0ffb88\" alt=\"תרשים שיבוץ הכיתות — בניין איילת השחר, אולפנית\" style=\"display: block; width: 100%; height: auto; border-radius: 8px;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"equipment\" style=\"scroll-margin-top: 90px; max-width: 880px; margin: 0 auto; padding: 40px 28px;\">\n    <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">רשימת ציוד כללית<\u002Fh2>\n    <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 20px;\"><\u002Fdiv>\n    <sc-if value=\"{{ closedEquipment }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 0 0 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\">ספרי קודש: סידור, תנ\"ך. מחברות וקלסרים, קלמר מאובזר, מחשבון מדעי ונעלי ספורט לשיעורי חנ\"ג.<\u002Fp>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ toggleEquipment }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #16283f; background: transparent; color: #16283f; font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 20px; border-radius: 999px;\">\n      <sc-if value=\"{{ openEquipment }}\" hint-placeholder-val=\"{{ false }}\">הצג פחות<\u002Fsc-if>\n      <sc-if value=\"{{ closedEquipment }}\" hint-placeholder-val=\"{{ true }}\">להמשך קריאה<\u002Fsc-if>\n    <\u002Fbutton>\n    <sc-if value=\"{{ openEquipment }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px; margin-top: 20px;\">\n        <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 14px; padding: 20px;\">\n          <div style=\"font-weight: 800; color: #16283f; font-size: 16px; margin-bottom: 10px;\">ספרי קודש<\u002Fdiv>\n          <div style=\"color: #3c4a58; font-size: 15px; line-height: 1.8;\">סידור, תנ\"ך<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 14px; padding: 20px;\">\n          <div style=\"font-weight: 800; color: #16283f; font-size: 16px; margin-bottom: 10px;\">מחברות וקלסרים<\u002Fdiv>\n          <ul style=\"margin: 0; padding-right: 20px; color: #3c4a58; font-size: 15px; line-height: 1.9;\">\n            <li>10 מחברות
