  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: 0;\">\n    <div style=\"display: flex; gap: 6px; flex-wrap: nowrap;\">\n      <a href=\"#values\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">ארבעת הערכים<\u002Fa>\n      <a href=\"#expectations\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">תיאום ציפיות<\u002Fa>\n      <a href=\"#phones\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">נוהל פלאפונים<\u002Fa>\n      <a href=\"#payments\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">תשלומים וספרים<\u002Fa>\n      <a href=\"#schedule\" style=\"text-decoration: none; color: #1f3a5f; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;\" style-hover=\"background: #f0efe4;\">לוח היום הראשון<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <header style=\"max-width: 880px; margin: 0 auto; padding: 64px 28px 40px; text-align: center;\">\n    <div style=\"position: relative; width: 200px; height: 200px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: center;\">\n      <div style=\"position: absolute; width: 0; height: 0; border-left: 100px solid transparent; border-right: 100px solid transparent; border-bottom: 170px solid #a4b83c; top: 6px; opacity: 0; animation: triangleIn 1.1s ease-out 0.15s forwards;\"><\u002Fdiv>\n      <img src=\"a99c3b10-4539-4b5c-8a31-7e41481b77c4\" alt=\"אמית חצור הגלילית\" style=\"position: relative; height: 130px; width: auto; opacity: 0; animation: logoPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;\">\n    <\u002Fdiv>\n    <div style=\"font-family: 'Frank Ruhl Libre', serif; font-style: italic; font-size: 20px; color: #6b7c50; margin-bottom: 10px; opacity: 0; animation: fadeUp 0.7s ease-out 0.9s forwards;\">\"חובת האדם בעולמו, כל עוד הנשמה באפו, להשתדל להיות הולך וגדל\" (החזו\"א)<\u002Fdiv>\n    <h1 style=\"font-size: 38px; font-weight: 800; color: #16283f; margin: 0 0 14px; line-height: 1.25; opacity: 0; animation: fadeUp 0.7s ease-out 1.05s forwards;\">לקראת פתיחת שנת הלימודים תשפ\"ז<\u002Fh1>\n    <p style=\"font-size: 19px; color: #5b6b7a; margin: 0; opacity: 0; animation: fadeUp 0.7s ease-out 1.2s forwards;\">הורים יקרים ואהובים, ה' עימכם<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"max-width: 720px; margin: 0 auto; padding: 0 28px 56px;\">\n    <p style=\"font-size: 17px; line-height: 1.9; color: #3c4a58; margin: 0; text-wrap: pretty; text-align: justify\">\n      בפרשת השבוע שקראנו לפני שבוע, קראנו על סימן הטהרה של הדג — כל דג שיש לו קשקשת וסנפיר כשר למאכל. מלמדים אותנו חז\"ל שבדרך הטבע כל דג שיש לו קשקשת יש לו גם סנפיר. שואלים חז\"ל, אם כך מדוע לא לכתוב שכל דג שיש לו קשקשת כשר? (הרי אם יש קשקשת יש סנפיר).\n      <br><br>\n      הקשקשת מבטאת את הדבר הקבוע — היציב, ואילו הסנפיר מבטא את התנועה והשינוי. כשיש את הדברים הקבועים בתורה, יש אפשרות להיות בתנועה גם לדברים המשתנים. היכולת ליצור שינוי היא על בסיס עוגנים ודברים קבועים שלא ניתנים לשינוי.\n      <br><br>\n      אנו משתדלים בבית החינוך להתחדש בכל שנה על בסיס הערכים הקבועים שנותנים לנו עוגן ויציבות — להמשיך להכות שורשים בארבעת ערכי בית החינוך, ולצד זה להיות ערים לצרכים שמתעוררים, לאפשר למידה מותאמת ולעדכן את התוכניות הערכיות-חברתיות כדי להיות הכי טובים שאפשר.\n      <br><br>\n      בע\"ה במהלך השנה הקרובה נשתדל לעלות קומה נוספת בארבעת ערכי בית החינוך.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"values\" style=\"scroll-margin-top: 90px; background: #16283f; padding: 64px 28px;\">\n    <div style=\"max-width: 880px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 40px;\">\n        <div style=\"color: #a4b83c; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; margin-bottom: 8px;\">מה מוביל אותנו השנה<\u002Fdiv>\n        <h2 style=\"color: #fff; font-size: 30px; font-weight: 800; margin: 0;\">ארבעת ערכי בית החינוך<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px;\">\n        <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"4\">\n          <div style=\"background: #1f3a5f; border-radius: 14px; padding: 24px; cursor: pointer;\" sc-camel-on-click=\"{{ v.toggle }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #a4b83c; flex-shrink: 0; position: relative;\">\n                  <sc-if value=\"{{ v.isTorah }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 13px; height: 17px; background: #16283f; border-radius: 2px; left: 9px; top: 13px; transform: rotate(-16deg);\"><\u002Fdiv>\n                    <div style=\"position: absolute; width: 13px; height: 17px; background: #16283f; border-radius: 2px; right: 9px; top: 13px; transform: rotate(16deg);\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isExcellence }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 18px; height: 18px; background: #16283f; top: 13px; left: 13px; transform: rotate(45deg); border-radius: 3px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isSocial }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #16283f; opacity: 0.85; left: 10px; top: 14px;\"><\u002Fdiv>\n                    <div style=\"position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #16283f; opacity: 0.85; right: 10px; top: 14px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isFamily }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position: absolute; width: 0; height: 0; left: 12px; top: 11px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 9px solid #16283f;\"><\u002Fdiv>\n                    <div style=\"position: absolute; width: 14px; height: 11px; background: #16283f; left: 15px; top: 20px;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <h3 style=\"color: #fff; font-size: 19px; font-weight: 700; margin: 0;\">{{ v.title }}<\u002Fh3>\n              <\u002Fdiv>\n              <div style=\"width: 26px; height: 26px; border-radius: 50%; background: #a4b83c; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #16283f; font-weight: 800; font-size: 16px;\">\n                <sc-if value=\"{{ v.open }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n                <sc-if value=\"{{ v.closed }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ v.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"color: #cfd8e2; font-size: 15px; line-height: 1.85; margin: 16px 0 0;\">{{ v.text }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"expectations\" style=\"scroll-margin-top: 90px; max-width: 880px; margin: 0 auto; padding: 64px 28px;\">\n    <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">תיאום ציפיות<\u002Fh2>\n    <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 28px;\"><\u002Fdiv>\n\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 0 0 8px;\">נוכחות והגעה בזמן לתפילה<\u002Fh3>\n    <p style=\"font-size: 16px; line-height: 1.85; color: #3c4a58; margin: 0 0 32px; text-align: justify\">\n      אנו מבקשים להקפיד על הגעה בזמן לבית החינוך, ובוודאי לא להחסיר ימים שלמים. אנו מבקשים מכם ההורים לשלב איתנו זרועות ולוודא שהבן/הבת מתמידים בהגעה לבית החינוך. לא ניתן לקיים תהליך משמעותי עם תלמיד/ה שנעדרים.\n    <\u002Fp>\n\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 0 0 16px;\">כללי הופעה חיצונית<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px;\">\n      <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 14px; padding: 22px;\">\n        <div style=\"display: inline-block; background: #eef1e0; color: #6b7c33; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;\">בנים<\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0 20px 0 0; font-size: 15px; line-height: 1.8; color: #3c4a58; text-align: justify\">\n          <li style=\"margin-bottom: 12px;\"><strong>חולצת תלבושת<\u002Fstrong> — עם לוגו \"להיות הולך וגדל\" (גאוות יחידה ושייכות), כיפה — \"כומתה יהודית\".<\u002Fli>\n          <li><strong>מכנס קצר<\u002Fstrong> — יש להקפיד על מכנס שמגיע עד הברכיים, ונעליים סגורות או סנדלים (אין להגיע עם כפכפים). תלמיד שיגיע עם מכנס קצר מעל הברכיים יחזור הביתה להחליף.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 14px; padding: 22px;\">\n        <div style=\"display: inline-block; background: #eef1e0; color: #6b7c33; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;\">בנות<\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0 20px 0 0; font-size: 15px; line-height: 1.8; color: #3c4a58; text-align: justify\">\n          <li><strong>חולצת תלבושת<\u002Fstrong> — חולצה עם סמל ביה\"ס<div>לא תתאפשר הגעה עם חולצה חשופה או בעלת שרוולים קצרים מידי (אורך שרוול- אגרוף מעל המרפק)<\u002Fdiv><\u002Fli><li style=\"margin-bottom: 12px; font-size: 15px\"><strong>חצאיות<\u002Fstrong> — מתחת לברך. מי שתגיע בבוקר עם חצאית קצרה תחזור באותו יום הביתה כדי להחליף.<\u002Fli>\n          \n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"phones\" style=\"scroll-margin-top: 90px; background: #f2f0e4; padding: 64px 28px;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 8px;\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1f3a5f; flex-shrink: 0; position: relative;\">\n          <div style=\"position: absolute; width: 16px; height: 26px; border: 2px solid #a4b83c; border-radius: 4px; left: 12px; top: 9px;\"><\u002Fdiv>\n          <div style=\"position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #a4b83c; left: 18px; top: 27px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0;\">נוהל פלאפונים<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 24px;\"><\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.9; color: #3c4a58; margin: 0; text-align: justify\">\n        בתחילת כל יום מחנכי ומחנכות הכיתות יאספו את הניידים ויחזירו אותם בסוף היום. אנו עדים ליותר ויותר בתי ספר בעולם ובארץ שמבינים שלא ניתן לקיים שגרת יום לימודים ושיח חינוכי מקדם כשהתלמיד/ה אוחז ביד את הנייד. הפלאפון משיח את הדעת ומוריד את רמת הקשב. בנוסף, הוא מעכב התפתחות בינאישית ויכולת ליצור אינטראקציה בריאה עם הסביבה.\n        <br><br>\n        במהלך השנה מחנכי הכיתות יובילו שיח ופעילות סביב נושא חשוב זה. אנו מבקשים מכם ההורים להיות שותפים מלאים במשימה המאתגרת בפניה אנו עומדים, מתוך אהבה לתלמידינו היקרים והאהובים ולמענם.\n        <br><br>\n        בהזדמנות זו אנו רוצים להמליץ לכלל ההורים לרכוש תוכנת הגנה לפלאפונים של הילדים. הילדים נחשפים במדיה לאלימות קשה, פורנוגרפיה ועוד, והמחקרים מדברים על חשיפה לפורנוגרפיה קשה כבר בשלבי היסודי. עלינו האחריות לשמור על הנשמות הטהורות שלנו. מי שמעוניין — שיצור קשר עם מחנך/מחנכת הכיתה, ואנחנו נסייע בשמחה.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"payments\" style=\"scroll-margin-top: 90px; max-width: 880px; margin: 0 auto; padding: 64px 28px;\">\n    <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">השתתפות הורים<\u002Fh2>\n    <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 24px;\"><\u002Fdiv>\n    <p style=\"font-size: 16px; line-height: 1.85; color: #3c4a58; margin: 0 0 36px;\">\n      גם השנה תתקיים \"השאלת ספרים\" בכל השכבות. רק תלמידים אשר ישלמו את מלוא סכום התשלום השנתי לבית הספר יוכלו להשתתף בפרויקט ולקבל את כל הספרים בימי החלוקה המסודרים.\n    <\u002Fp>\n\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 0 0 14px;\">בחרו שכבה כדי לראות את סכום התשלום<\u002Fh3>\n    <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ g.select }}\" style=\"border: 2px solid #1f3a5f; background: #fff; color: #1f3a5f; font-weight: 700; font-size: 15px; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-family: 'Heebo', sans-serif;\" style-hover=\"background: #eef1e0;\">שכבה {{ g.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background: #16283f; border-radius: 14px; padding: 22px 26px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 10px;\">\n      <span style=\"color: #cfd8e2; font-size: 16px; font-weight: 600;\">סה\"כ לשכבה {{ selectedGradeLabel }}<\u002Fspan>\n      <span style=\"color: #a4b83c; font-size: 30px; font-weight: 800;\">{{ selectedTotal }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x: auto; border: 1px solid #e6e2d8; border-radius: 14px;\">\n      <div style=\"min-width: 640px; font-size: 14px;\">\n        <div style=\"display: grid; grid-template-columns: 2fr repeat(6, 1fr); background: #f2f0e4;\">\n          <div style=\"text-align: right; padding: 12px 16px; font-weight: 700; color: #16283f;\">סעיף<\u002Fdiv>\n          <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <div style=\"text-align: center; padding: 12px 10px; font-weight: 700; color: #16283f;\">{{ g.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ feeRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n          <div style=\"display: grid; grid-template-columns: 2fr repeat(6, 1fr); border-top: 1px solid #efece0;\">\n            <div style=\"padding: 10px 16px; color: #3c4a58;\">{{ row.label }}<\u002Fdiv>\n            <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"6\">\n              <div style=\"text-align: center; padding: 10px; color: #3c4a58;\">{{ cell.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display: grid; grid-template-columns: 2fr repeat(6, 1fr); border-top: 2px solid #1f3a5f; background: #f2f0e4;\">\n          <div style=\"padding: 12px 16px; font-weight: 800; color: #16283f;\">סה\"כ<\u002Fdiv>\n          <sc-for list=\"{{ totals }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"text-align: center; padding: 12px; font-weight: 800; color: #16283f;\">{{ t.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 18px; font-weight: 700; color: #1f3a5f; margin: 36px 0 14px;\">ימי חלוקת ספרים<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;\">\n      <sc-for list=\"{{ bookDays }}\" as=\"d\" hint-placeholder-count=\"5\">\n        <div style=\"background: #fff; border: 1px solid #e6e2d8; border-radius: 12px; padding: 16px; text-align: center;\">\n          <div style=\"font-weight: 700; color: #16283f; font-size: 15px; margin-bottom: 4px;\">{{ d.day }}<\u002Fdiv>\n          <div style=\"color: #8a7f56; font-size: 13px; margin-bottom: 8px;\">{{ d.hebrew }} · {{ d.date }}<\u002Fdiv>\n          <div style=\"display: inline-block; background: #eef1e0; color: #6b7c33; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px;\">{{ d.hours }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"schedule\" style=\"scroll-margin-top: 90px; background: #f2f0e4; padding: 64px 28px;\">\n    <div style=\"max-width: 880px; margin: 0 auto;\">\n      <h2 style=\"font-size: 28px; font-weight: 800; color: #16283f; margin: 0 0 8px;\">לו\"ז יום ראשון ללימודים<\u002Fh2>\n      <div style=\"width: 48px; height: 4px; background: #a4b83c; border-radius: 2px; margin-bottom: 28px;\"><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 20px;\">\n        <div style=\"background: #fff; border-radius: 14px; padding: 22px;\">\n          <div style=\"display: inline-block; background: #16283f; color: #fff; font-weight: 700; font-size: 13px; padding: 4px 14px; border-radius: 999px; margin-bottom: 16px;\">נתיב בנים<\u002Fdiv>\n          <sc-for list=\"{{ boysSchedule }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #efece0;\">\n              <div style=\"width: 110px; flex-shrink: 0; font-weight: 700; color: #1f3a5f; font-size: 14px;\">{{ s.time }}<\u002Fdiv>\n              <div style=\"color: #3c4a58; font-size: 14px;\">{{ s.activity }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background: #fff; border-radius: 14px; padding: 22px;\">\n          <div style=\"display: inline-block; background: #a4b83c; color: #16283f; font-weight: 700; font-size: 13px; padding: 4px 14px; border-radius: 999px; margin-bottom: 16px;\">נתיב בנות<\u002Fdiv>\n          <sc-for list=\"{{ girlsSchedule }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid #efece0;\">\n              <div style=\"width: 110px; flex-shrink: 0; font-weight: 700; color: #1f3a5f; font-size: 14px;\">{{ s.time }}<\u002Fdiv>\n              <div style=\"color: #3c4a58; font-size: 14px;\">{{ s.activity }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"text-align: center; padding: 48px 28px;\">\n    <img src=\"a99c3b10-4539-4b5c-8a31-7e41481b77c4\" alt=\"אמית חצור הגלילית\" style=\"height: 60px; width: auto; margin-bottom: 12px;\">\n    <div style=\"color: #8a95a0; font-size: 14px;\">בית החינוך אמית חצור הגלילית · מכתב פתיחת שנת הלימודים תשפ\"ז<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    selectedGrade: 'ז',\n    openValues: { torah: true, excellence: true, social: true, family: true }\n  };\n\n  grades = ['ז', 'ח', 'ט', 'י', 'יא', 'יב'];\n\n  feeRows = [\n    { label: 'ביטוח תאונות', values: [69, 69, 69, 69, 69, 69] },\n    { label: 'ספרי לימוד', values: [280, 280, 280, 320, 320, 320] },\n    { label: 'טיולים (השתתפות במסע שנתי)', values: [387, 387, 387, 513, 513, 616] },\n    { label: 'סל תרבות', values: [137, 137, 153, 164, 164, 164] },\n    { label: 'שבת', values: [340, 340, 340, 340, 340, 340] },\n    { label: 'פעילות תורנית — סיורים והרצאות', values: [330, 330, 330, 300, 300, 300] },\n    { label: 'סמינריון (העצמות לפי שכבות וסיורים חד יומיים)', values: [400, 400, 400, 400, 400, 400] },\n    { label: 'של\"ח', values: [null, 150, 150, 150, 150, null] },\n    { label: 'קרן קרב עם העירייה', values: [250, 250, null, null, null, null] },\n    { label: 'מסיבת סיום', values: [null, null, null, null, null, 200] },\n  ];\n\n  totals = [2193, 2343, 2109, 2256, 2106, 2409];\n\n  valuesData = [\n    { key: 'torah', title: 'תורת חיים', text: 'אנחנו בתהליכי מינוי רב לבית החינוך, ובע\"ה בימים הקרובים ימונה רב לבית הספר אשר יוביל תוכנית להעמקת הזהות היהודית, לימוד ואהבת התורה. יוקם בית מדרש עם שיעורים מגוונים, והתלמידים ייחשפו לישיבות ורבנים בולטים ובנתיב הבנות נמשיך להפעיל ולחזק את מדרשת נהוראי מתוך רצון להגדיל תורה ולהאדירה.' },\n    { key: 'excellence', title: 'מיצוי ומצוינות', text: 'ב\"ה ההישגים של בית החינוך מהגבוהים בסביבה, הן באחוזי הבגרות והן באיכות התעודה. לפני שנתיים הכנסנו לבית החינוך את תפיסת השל\"ם של רשת אמי\"ת הכוללת את שערי הלמידה — שער מפגש, שער עצמאות ושער גילוי. בשנה הבאה נעמיק את הלמידה בתפיסה זו ונתרחב לכל חטיבת הביניים. בחטיבה העליונה, בנוסף למגמות הקיימות — פיזיקה, מחשבים, ביולוגיה, כלכלה ותקשוב — תיפתח מגמת תחבורה מתקדמת שתשתלב עם נבחרות המייקרים.' },\n    { key: 'social', title: 'חברתי ערכי', text: 'לאחר מספר שנים שהטמענו את מודל ההעצמות הכיתתיות, הכוללות את תוכניות קלמרים, מל\"ח הארץ, ימיה וצלילה, בשנה הבאה נוסיף העצמה נוספת שתפתח חוסן ופיתוח חוזקות דרך גלישת גלים בים התיכון. בנוסף, נעמיק את מודל הנבחרות ונפתח בנתיב הבנות 4 נבחרות — אקו רפואה, ציור, תיאטרון ומייקרים. בנתיב הבנים אנחנו עוד עמלים על תוכנית הנבחרות, כרגע מסתמן שיפתחו נבחרות של אופניים, שדאות, מייקרים וכדורסל, ובהמשך יתווספו עוד 2 נבחרות נוספות.' },\n    { key: 'family', title: 'משפחתיות', text: 'אנו מחזקים בבית החינוך את ערך הקהילתיות והמשפחתיות. אנו מאמינים שילד שטוב לו הוא ילד שיצליח להתפתח ולהגשים חלומות. גם השנה נמשיך להעמיק בתוכנית התצא\"מ — תוכנית צמיחה אישית מקצועית, לצד יצירת אקלים משפחתי ותחושת מוגנות.' },\n  ];\n\n  bookDays = [\n    { day: 'יום שלישי', hebrew: \"יב' אלול\", date: '25.08.26', hours: '09:00–16:00' },\n    { day: 'יום רביעי', hebrew: \"יג' אלול\", date: '26.08.26', hours: '09:00–14:00' },\n    { day: 'יום חמישי', hebrew: \"יד' אלול\", date: '27.08.26', hours: '09:00–13:00' },\n    { day: 'יום ראשון', hebrew: \"יז' אלול\", date: '30.08.26', hours: '09:00–13:00' },\n    { day: 'יום שני', hebrew: \"יח' אלול\", date: '31.08.26', hours: '09:00–13:00' },\n  ];\n\n  boysSchedule = [\n    { time: '07:30–08:55', activity: 'תפילה + סליחות' },\n    { time: '08:55–09:15', activity: 'הפסקה' },\n    { time: '09:15–10:00', activity: 'מפגש מחנך' },\n    { time: '10:00–10:30', activity: 'הפסקה' },\n    { time: '10:30–11:15', activity: 'למידה לפי מערכת השעות' },\n    { time: '11:15–12:00', activity: 'טקס לכלל התלמידים' },\n    { time: '12:00', activity: 'סיום לימודים' },\n  ];\n\n  girlsSchedule = [\n    { time: '08:00–08:30', activity: 'תפילה' },\n    { time: '08:30–09:15', activity: 'מפגש מחנכת' },\n    { time: '09:15–10:00', activity: 'טקס לכלל התלמידות' },\n    { time: '10:00–10:30', activity: 'הפסקה מתוקה' },\n    { time: '10:30–11:15', activity: 'למידה לפי המערכות' },\n    { time: '11:15–12:00', activity: 'למידה לפי המערכות' },\n    { time: '12:00', activity: 'סיום לימודים' },\n  ];\n\n  toggleValue = (key) => this.setState(s => ({ openValues: { ...s.openValues, [key]: !s.openValues[key] } }));\n  selectGrade = (g) => this.setState({ selectedGrade: g });\n\n  formatAmount(v) {\n    return v == null ? '—' : '₪' + v.toLocaleString('en-US');\n  }\n\n  renderVals() {\n    const gradeIndex = this.grades.indexOf(this.state.selectedGrade);\n    const grades = this.grades.map((label, i) => ({ label, select: () => this.selectGrade(label) }));\n    const feeRows = this.feeRows.map(r => ({\n      label: r.label,\n      cells: r.values.map(v => ({ text: this.formatAmount(v) }))\n    }));\n    const totals = this.totals.map(v => ({ text: this.formatAmount(v) }));\n    const values = this.valuesData.map(v => ({\n      ...v,\n      open: this.state.openValues[v.key],\n      closed: !this.state.openValues[v.key],\n      toggle: () => this.toggleValue(v.key),\n      isTorah: v.key === 'torah',\n      isExcellence: v.key === 'excellence',\n      isSocial: v.key === 'social',\n      isFamily: v.key === 'family'\n    }));\n    return {\n      grades,\n      feeRows,\n      totals,\n      selectedGradeLabel: this.state.selectedGrade,\n      selectedTotal: this.formatAmount(this.totals[gradeIndex]),\n      values,\n      bookDays: this.bookDays,\n      boysSchedule: this.boysSchedule,\n      girlsSchedule: this.girlsSchedule,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
